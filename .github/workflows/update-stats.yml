name: 🍟 Mise à jour stats Lotto

on:
  schedule:
    - cron: '0 7 * * 1'   # Chaque lundi à 7h UTC (9h heure belge)
  workflow_dispatch:        # Déclenchement manuel depuis l'onglet Actions

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← Fix avertissement Node.js

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout du repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances
        run: pip install requests beautifulsoup4 lxml

      - name: 🔄 Mise à jour des statistiques
        run: python scripts/update_stats.py

      - name: 💾 Commit & Push si changement
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add stats.json
          git diff --staged --quiet && echo "Aucun changement." || \
            (git commit -m "🍟 Mise à jour automatique des stats Lotto — $(date '+%d/%m/%Y')" && git push)
